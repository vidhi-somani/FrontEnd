<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Pattern with Pawns</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f0f2f5;
    font-family: Arial, Helvetica, sans-serif;
  }

  .board-wrapper {
    display: inline-block;
    border: 4px solid #000000;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    background-color: #ffffff;
  }

  .chessboard {
    display: flex;
    flex-direction: column;
  }

  .row {
    display: flex;
  }

  .square {
    width: 60px;
    height: 60px;
    background-color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    position: relative;
  }

  /* Flip colors on alternating rows to create the checker pattern */
  .row:nth-child(odd) .square:nth-child(even),
  .row:nth-child(even) .square:nth-child(odd) {
    background-color: #000000;
  }

  /* Pawn color depends on square background for visibility */
  .row:nth-child(odd) .square:nth-child(even) .pawn,
  .row:nth-child(even) .square:nth-child(odd) .pawn {
    color: #ffffff;
  }

  .row:nth-child(odd) .square:nth-child(odd) .pawn,
  .row:nth-child(even) .square:nth-child(even) .pawn {
    color: #000000;
  }

  .pawn {
    line-height: 1;
  }

  /* Column labels row (A-H) */
  .col-labels {
    display: flex;
  }

  .col-labels .label {
    width: 60px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
  }

  .corner {
    width: 34px;
    height: 30px;
  }

  /* Row labels (1-8) placed beside each row */
  .row-with-label {
    display: flex;
  }

  .row-label {
    width: 30px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
  }

  .board-outer {
    display: flex;
    flex-direction: column;
  }

  .row-labels-col {
    display: flex;
    flex-direction: column;
  }

  .board-body {
    display: flex;
  }
</style>
</head>
<body>

  <div class="board-outer">

    <!-- Column labels A-H -->
    <div class="col-labels">
      <div class="corner"></div>
      <div class="label">A</div>
      <div class="label">B</div>
      <div class="label">C</div>
      <div class="label">D</div>
      <div class="label">E</div>
      <div class="label">F</div>
      <div class="label">G</div>
      <div class="label">H</div>
    </div>

    <div class="board-body">

      <!-- Row labels 8 to 1 (top to bottom, standard chess orientation) -->
      <div class="row-labels-col">
        <div class="row-label">8</div>
        <div class="row-label">7</div>
        <div class="row-label">6</div>
        <div class="row-label">5</div>
        <div class="row-label">4</div>
        <div class="row-label">3</div>
        <div class="row-label">2</div>
        <div class="row-label">1</div>
      </div>

      <div class="board-wrapper">
        <div class="chessboard">

          <!-- Row 8: black back rank -->
          <div class="row">
            <div class="square"><span class="pawn">&#9820;</span></div>
            <div class="square"><span class="pawn">&#9822;</span></div>
            <div class="square"><span class="pawn">&#9821;</span></div>
            <div class="square"><span class="pawn">&#9819;</span></div>
            <div class="square"><span class="pawn">&#9818;</span></div>
            <div class="square"><span class="pawn">&#9821;</span></div>
            <div class="square"><span class="pawn">&#9822;</span></div>
            <div class="square"><span class="pawn">&#9820;</span></div>
          </div>

          <!-- Row 7: black pawns -->
          <div class="row">
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
            <div class="square"><span class="pawn">&#9823;</span></div>
          </div>

          <!-- Rows 6 to 3: empty -->
          <div class="row">
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
          </div>
          <div class="row">
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
          </div>
          <div class="row">
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
          </div>
          <div class="row">
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
            <div class="square"></div><div class="square"></div><div class="square"></div><div class="square"></div>
          </div>

          <!-- Row 2: white pawns -->
          <div class="row">
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
            <div class="square"><span class="pawn">&#9817;</span></div>
          </div>

          <!-- Row 1: white back rank -->
          <div class="row">
            <div class="square"><span class="pawn">&#9814;</span></div>
            <div class="square"><span class="pawn">&#9816;</span></div>
            <div class="square"><span class="pawn">&#9815;</span></div>
            <div class="square"><span class="pawn">&#9813;</span></div>
            <div class="square"><span class="pawn">&#9812;</span></div>
            <div class="square"><span class="pawn">&#9815;</span></div>
            <div class="square"><span class="pawn">&#9816;</span></div>
            <div class="square"><span class="pawn">&#9814;</span></div>
          </div>

        </div>
      </div>

    </div>
  </div>

</body>
</html>
