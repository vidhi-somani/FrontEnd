<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<link rel="stylesheet" href="insta.css">
</head>
<body>

  <div class="container">

    <div class="login-box">
      <h1 class="logo">Instagram</h1>

      <form onsubmit="return false;">
        <input type="text" placeholder="Phone number, username, or email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Log in</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <a href="#" class="fb-login">
        <span class="fb-icon">📘</span> Log in with Facebook
      </a>

      <a href="#" class="forgot-link">Forgot password?</a>
    </div>

    <div class="signup-box">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>

    <div class="app-box">
      <p>Get the app.</p>
      <div class="app-buttons">
        <span class="app-badge">App Store</span>
        <span class="app-badge">Google Play</span>
      </div>
    </div>

  </div>

  <footer>
    <p>This is a UI clone made for practice/learning purposes and is not affiliated with Instagram/Meta.</p>
  </footer>

</body>
</html>
