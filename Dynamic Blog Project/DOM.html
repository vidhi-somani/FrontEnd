<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <h1 id="heading">Hello Vidhi</h1>
    <p id="message">Welcome to Javascript.</p>
    <button onclick="changeContent()">Click me</button>
    <script>
        function changeContent(){
            document.getElementsById("heading").textContent = "Welcome to JS"
        }
    </script>
</body>
</html>
