
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Board</title>
<link rel="stylesheet" href="Ludo.css">
</head>
<body>

  <div class="ludo-board">

    <!-- Red home (top-left) -->
    <div class="home home-red">
      <div class="home-inner">
        <div class="peg"></div><div class="peg"></div>
        <div class="peg"></div><div class="peg"></div>
      </div>
    </div>

    <!-- Top arm (green lane) -->
    <div class="arm-top">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <!-- Green home (top-right) -->
    <div class="home home-green">
      <div class="home-inner">
        <div class="peg"></div><div class="peg"></div>
        <div class="peg"></div><div class="peg"></div>
      </div>
    </div>

    <!-- Left arm (red lane) -->
    <div class="arm-left">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <!-- Center home triangle -->
    <div class="center"></div>

    <!-- Right arm (yellow lane) -->
    <div class="arm-right">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <!-- Blue home (bottom-left) -->
    <div class="home home-blue">
      <div class="home-inner">
        <div class="peg"></div><div class="peg"></div>
        <div class="peg"></div><div class="peg"></div>
      </div>
    </div>

    <!-- Bottom arm (blue lane) -->
    <div class="arm-bottom">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>

    <!-- Yellow home (bottom-right) -->
    <div class="home home-yellow">
      <div class="home-inner">
        <div class="peg"></div><div class="peg"></div>
        <div class="peg"></div><div class="peg"></div>
      </div>
    </div>

  </div>

</body>
</html>
